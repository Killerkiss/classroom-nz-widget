name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm 11 gates package install scripts; Electron needs its postinstall to
      # download the binary, so approvals are committed in package.json.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # A build must not require real credentials; sign-in is a runtime concern.
          GOOGLE_CLIENT_ID: ''
          GOOGLE_CLIENT_SECRET: ''
